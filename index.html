<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <section class="w-full max-w-[500px] mx-auto">
        <div class="h-[250px] bg-[url('./images/image-product-mobile.jpg')]
            bg-cover bg-center
            md:bg-[url('./image/image-product-desktop')]">></div>
        <div class="p-4">

       
        <span class="-tracking-2"> PERFUME </span>
        <h1 class="text-3xl font-bold">Gabrielle Essence Eau De Parfum</h1>
        <p>
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div>
          <span>$149.99</span>
          <span> $169.99</span>
          <button>Add to Cart</button>
        </div>
      </section>
       </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/solzambrano/product_Card">Your Name Here</a>.
    </footer>
  </body>
</html>
