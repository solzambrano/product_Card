<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="py-12 bg-[var(--cream)]">
      <article
        class="pb-8 rounded-2xl bg-[var(--white)] w-full max-w-[300px] mx-auto md:min-w-[800px] md:flex sm:pb-0">
        <div
          class="h-[250px] bg-[url('./images/image-product-mobile.jpg')] bg-cover bg-center md:h-[500px] md:bg-[url('./images/image-product-desktop.jpg')] md:min-w-[400px]"></div>
        <section class="px-4 md:px-10">
          <header class="md:pr-20">
            <span
              class="block text-[var(--gray)] tracking-[0.4em] my-6 md:pt-8">
              PERFUME
            </span>
            <h1 class="font-heading text-3xl font-bold md:text-4xl">
              Gabrielle Essence Eau De Parfum
            </h1>
          </header>
          <p class="text-sm text-[var(--gray)] my-4 md:tracking-wider">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <span
            class="font-heading text-4xl font-bold pr-4 text-[var(--green-500)]"
            >$149.99</span
          >
          <span class="align-[8px] line-through text-[var(--gray)]">
            $169.99</span
          >
          <footer
            class="flex justify-center mt-6 rounded-xl gap-4 hover:bg-[var(--green-700)] bg-[var(--green-500)] py-4">
            <img class="w-1/7 h-1/7" src="./images/icon-cart.svg" alt="" />
            <button class="text-lg text-[var(--white)] font-bold">
              Add to Cart
            </button>
          </footer>
        </section>
      </article>
    </main>

    <footer class="text-[var(--gray)] mt-8">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/solzambrano/product_Card">Soledad</a>.
    </footer>
  </body>
</html>
