<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="bg-[var(--cream)]">
      <div
        class="h-[250px] bg-[url('./images/image-product-mobile.jpg')] bg-cover bg-center md:h-[500px] md:bg-[url('./images/image-product-desktop.jpg')]"></div>
      <section
        class="rounded-2xl px-6 bg-[var(--white)] w-full max-w-[300px] mx-auto">
        <span class="block text-[var(--gray)] tracking-[0.4em] mb-4">
          PERFUME
        </span>
        <h1 class="font-heading text-3xl font-bold">
          Gabrielle Essence Eau De Parfum
        </h1>
        <p class="text-sm text-[var(--gray)] my-4">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <span
          class="font-heading text-4xl font-bold pr-4 text-[var(--green-500)]"
          >$149.99</span
        >
        <span class="align-[8px] line-through text-[var(--gray)]">
          $169.99</span
        >
        <div
          class="flex justify-center mt-6 rounded-xl gap-4 bg-[var(--green-500)] py-4">
          <img class="w-1/7 h-1/7" src="./images/icon-cart.svg" alt="" />
          <button class="text-lg text-[var(--white)] font-bold">
            Add to Cart
          </button>
        </div>
      </section>
    </main>

    <footer class="text-[var(--gray)] mt-8">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/solzambrano/product_Card">Soledad</a>.
    </footer>
  </body>
</html>
